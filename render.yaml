services:
  - type: web
    name: web-scraper-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/v1/health/ready
    envVars:
      - key: APP_ENV
        value: production
      - key: ALLOWED_ORIGINS
        sync: false          # set this in the Render dashboard to your Netlify URL
      - key: LOG_LEVEL
        value: INFO
      - key: RATE_LIMIT_PER_IP_PER_MINUTE
        value: "20"
      - key: MAX_RESULT_ROWS
        value: "2000"
      - key: CACHE_TTL_SECONDS
        value: "300"
      - key: ROBOTS_CACHE_TTL_SECONDS
        value: "3600"
      - key: MAX_REDIRECTS
        value: "3"
      - key: REQUEST_TIMEOUT
        value: "15"
      - key: CONNECT_TIMEOUT
        value: "5"
      - key: MAX_RESPONSE_SIZE
        value: "10485760"
      - key: MAX_RETRIES
        value: "1"
      - key: GLOBAL_CONCURRENCY_LIMIT
        value: "20"
      - key: PER_DOMAIN_REQUEST_DELAY_MS
        value: "500"
      - key: SCRAPER_USER_AGENT
        value: "UniversalWebDataExtractor/1.0"
