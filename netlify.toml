[build]
  base    = "frontend"
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # Set VITE_API_BASE in the Netlify dashboard → Site settings → Environment variables
  # e.g. VITE_API_BASE = https://web-scraper-backend.onrender.com/api/v1

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
